<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Getaway Adventures 502</title>
    <script>
      // GitHub Pages no conoce las rutas de la app (p. ej. /tour/acatenango).
      // Redirige a la app pasando la ruta en ?p=, y src/main.tsx la restaura sin recargar.
      (function () {
        var l = window.location;
        var base = '/' + l.pathname.split('/')[1] + '/';
        var resto = l.pathname.slice(base.length);
        l.replace(base + '?p=' + encodeURIComponent(resto + l.search) + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
